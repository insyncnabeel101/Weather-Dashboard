<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weatherline — Field Observatory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-weather="default" data-daytime="day">

  <!-- Ambient sky background. Purely decorative; tinted dynamically by script.js -->
  <div class="sky" aria-hidden="true">
    <div class="sky__orb"></div>
    <div class="sky__cloud sky__cloud--a"></div>
    <div class="sky__cloud sky__cloud--b"></div>
  </div>

  <main class="panel">

    <header class="panel__header">
      <p class="eyebrow">Field Observatory No. 7</p>
      <h1 class="brand">Weatherline</h1>
    </header>

    <form class="search" id="searchForm" autocomplete="off">
      <label for="locationInput" class="sr-only">Search for a city or place</label>
      <input
        type="text"
        id="locationInput"
        name="location"
        placeholder="Search a city or place&hellip;"
        autocomplete="off"
      />
      <button type="submit" class="btn btn--icon" aria-label="Search location">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </button>
      <button type="button" class="btn btn--icon" id="locateBtn" aria-label="Use my current location">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v3M12 19v3M22 12h-3M5 12H2" />
        </svg>
      </button>
    </form>

    <!-- Live region: loading / error messaging -->
    <p class="status" id="statusRegion" role="status" aria-live="polite"></p>

    <!-- Empty / invitation state, shown before any reading exists -->
    <section class="empty" id="emptyState">
      <svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M16 32a8 8 0 1 1 1.6-15.84A10 10 0 0 1 37 20.2 7 7 0 0 1 35.5 34H16Z" />
      </svg>
      <p>Search a city above, or share your location to take a reading.</p>
    </section>

    <!-- Primary reading -->
    <section class="reading" id="readingSection" hidden>
      <div class="reading__icon" id="weatherIcon" aria-hidden="true"></div>

      <div class="reading__temp-row">
        <span class="reading__temp" id="temperature">&mdash;</span>
        <div class="unit-toggle" role="group" aria-label="Temperature unit">
          <button type="button" class="unit-btn is-active" id="unitC" aria-pressed="true">&deg;C</button>
          <button type="button" class="unit-btn" id="unitF" aria-pressed="false">&deg;F</button>
        </div>
      </div>

      <p class="reading__condition" id="condition">&mdash;</p>
      <p class="reading__place" id="placeName">&mdash;</p>
      <p class="reading__meta" id="dateTime">&mdash;</p>
    </section>

    <!-- Instrument readout grid -->
    <section class="stats" id="statsGrid" hidden>
      <div class="stat">
        <span class="stat__label">Feels Like</span>
        <span class="stat__value" id="statFeels">&mdash;</span>
      </div>
      <div class="stat">
        <span class="stat__label">Humidity</span>
        <span class="stat__value" id="statHumidity">&mdash;</span>
      </div>
      <div class="stat stat--wind">
        <span class="stat__label">Wind</span>
        <span class="stat__value" id="statWind">&mdash;</span>
        <svg class="stat__compass" id="windArrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5M12 5l-5 5M12 5l5 5" />
        </svg>
      </div>
      <div class="stat">
        <span class="stat__label">Pressure</span>
        <span class="stat__value" id="statPressure">&mdash;</span>
      </div>
      <div class="stat">
        <span class="stat__label">UV Index</span>
        <span class="stat__value" id="statUv">&mdash;</span>
      </div>
      <div class="stat">
        <span class="stat__label">High / Low</span>
        <span class="stat__value" id="statHighLow">&mdash;</span>
      </div>
    </section>

    <footer class="panel__footer">
      <p>Data from Open&#8209;Meteo &middot; updates each time you take a reading</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
